{% extends 'base.html' %}{% block title %}FAQ | {{site_settings.website_name}}{% endblock %}{% block content %}<section class="pagehero"><div class="container"><span class="eyebrow">Help centre</span><h1>Frequently Asked Questions</h1></div></section><section class="section"><div class="container narrow"><div class="accordion" id="faq">{% for f in faqs %}<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" data-bs-toggle="collapse" data-bs-target="#f{{f.pk}}">{{f.question}}</button></h2><div id="f{{f.pk}}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faq"><div class="accordion-body">{{f.answer|linebreaks}}</div></div></div>{% empty %}<div class="empty">No FAQs published.</div>{% endfor %}</div></div></section>{% endblock %}
